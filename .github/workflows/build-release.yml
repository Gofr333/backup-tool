name: Build Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name BackupTool backup_tool.py

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\BackupTool.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  BackupTool.exe" | Out-File -Encoding ascii "dist\BackupTool.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BackupTool-Windows
          path: |
            dist/BackupTool.exe
            dist/BackupTool.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist\BackupTool.exe" `
            "dist\BackupTool.sha256" `
            --title "Backup Tool ${{ github.ref_name }}" `
            --generate-notes
